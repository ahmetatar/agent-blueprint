name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --cov=agent_blueprint --cov-report=term --cov-fail-under=79

      - name: Build package
        run: python -m build

      - name: CLI smoke tests
        run: |
          abp --help
          abp validate tests/fixtures/basic_chatbot.yml
          abp lint tests/fixtures/basic_chatbot.yml

  e2e:
    # Runs generated projects on the real LangGraph runtime, fully offline
    # (mocked LLM, stubbed tools, no API keys). The `test` job never installs
    # LangGraph, so this is the only place generated code actually executes.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Offline harness on real LangGraph
        run: abp test tests/fixtures/e2e_offline.yml --install --save-traces none

      - name: Packaged CLI smoke
        # Package the fixture, install it into a clean venv and run the
        # resulting console script offline (mocked LLM, stubbed tools).
        run: |
          abp package tests/fixtures/e2e_offline.yml -o "$RUNNER_TEMP/e2e-cli"
          python -m venv "$RUNNER_TEMP/pkg-venv"
          "$RUNNER_TEMP/pkg-venv/bin/pip" install -q "$RUNNER_TEMP/e2e-cli"
          cd "$RUNNER_TEMP"
          out=$(ABP_LLM_MODE=mock ABP_TOOL_MODE=stub \
            ABP_HARNESS_FIXTURES="$(cat "$GITHUB_WORKSPACE/tests/fixtures/e2e_offline_cli_fixtures.json")" \
            "$RUNNER_TEMP/pkg-venv/bin/e2e-offline" "Please refund invoice 123")
          echo "$out"
          test "$out" = "Refund handled."

      - name: Real-runtime tests
        run: |
          pytest tests/test_generators/test_router_signals.py \
            "tests/test_supervisor.py::TestSupervisorToolPolicies" -v
