[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-blueprint"
version = "0.3.0"
description = "Declarative, framework-agnostic AI agent orchestration via YAML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "llm", "langgraph", "yaml", "cli", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
]

[project.scripts]
abp = "agent_blueprint.cli.app:app"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "commitizen>=3.27",
    "opentelemetry-sdk>=1.25",  # exercises the generated _abp_otel bridge in tests
    "pre-commit>=3.7",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    # editor server deps + httpx, so tests exercise the editor API (TestClient)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "watchfiles>=0.22",
]
deploy-azure = ["azure-mgmt-containerinstance", "azure-identity"]
deploy-aws = ["boto3"]
deploy-gcp = ["google-cloud-run"]
# websockets: uvicorn's plain install has no WS protocol implementation
# langgraph-checkpoint-sqlite: durable chat sessions (E5.5) — the editor runs the
# generated project with a SQLite checkpointer (ABP_CHECKPOINT_DB) so a
# conversation survives editor restarts; imported by the generated process only.
editor = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchfiles>=0.22",
    "websockets>=12",
    "langgraph-checkpoint-sqlite>=1.0",
]

[tool.hatch.build]
# Built frontend assets are VCS-ignored but must ship in the package.
artifacts = ["src/agent_blueprint/editor/static/"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_blueprint"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The sdist ships prebuilt editor assets (via artifacts) instead of the
# frontend source, so installing from sdist never needs Node.
exclude = ["frontend"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.0"
version_provider = "pep621"
tag_format = "v$version"
version_scheme = "pep440"
annotated_tag = true
update_changelog_on_bump = true
